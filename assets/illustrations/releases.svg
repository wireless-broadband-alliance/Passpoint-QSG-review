<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 178" role="img"
     aria-label="Passpoint releases R1, R2 and R3 building on each other">
  <style>
    svg { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bg{fill:var(--soft,#ede9fe)} .sacc{fill:none;stroke:var(--acc,#5b21b6)}
    .ink{fill:#14211f} text{font-weight:760}
    .ta{fill:var(--acc,#5b21b6);font-weight:860} .tm{fill:#60706d;font-weight:700}
    .hl{fill:none;stroke:var(--acc,#5b21b6);stroke-width:3;opacity:0}
    @keyframes rel-hi1{0%{opacity:0}12%{opacity:1}30%,100%{opacity:0}}
    @keyframes rel-hi2{0%,33%{opacity:0}45%{opacity:1}63%,100%{opacity:0}}
    @keyframes rel-hi3{0%,66%{opacity:0}80%{opacity:1}100%{opacity:0}}
    .c1{animation:rel-hi1 3.9s ease-in-out infinite}
    .c2{animation:rel-hi2 3.9s ease-in-out infinite}
    .c3{animation:rel-hi3 3.9s ease-in-out infinite}
    @media (prefers-reduced-motion: reduce){
      .c1,.c2,.c3{animation:none}
      .c3{opacity:1}
    }
  </style>

  <rect class="bg" width="280" height="178"/>
  <ellipse class="ink" cx="140" cy="152" rx="112" ry="6" opacity="0.05"/>

  <rect fill="#fff" class="sacc" x="30"  y="100" width="64" height="44" rx="8" stroke-width="2.5"/>
  <rect fill="#fff" class="sacc" x="108" y="74"  width="64" height="70" rx="8" stroke-width="2.5"/>
  <rect fill="#fff" class="sacc" x="186" y="46"  width="64" height="98" rx="8" stroke-width="2.5"/>

  <text class="ta" x="62"  y="126" font-size="19" text-anchor="middle">R1</text>
  <text class="ta" x="140" y="110" font-size="19" text-anchor="middle">R2</text>
  <text class="ta" x="218" y="82"  font-size="19" text-anchor="middle">R3</text>
  <text class="tm" x="62"  y="138" font-size="9" text-anchor="middle" textLength="32" lengthAdjust="spacingAndGlyphs">Core</text>
  <text class="tm" x="140" y="138" font-size="9" text-anchor="middle" textLength="44" lengthAdjust="spacingAndGlyphs">Sign-up</text>
  <text class="tm" x="218" y="138" font-size="9" text-anchor="middle" textLength="54" lengthAdjust="spacingAndGlyphs">Venue + WPA3</text>

  <rect class="hl c1" x="27"  y="97"  width="70" height="50" rx="10"/>
  <rect class="hl c2" x="105" y="71"  width="70" height="76" rx="10"/>
  <rect class="hl c3" x="183" y="43"  width="70" height="104" rx="10"/>
</svg>
