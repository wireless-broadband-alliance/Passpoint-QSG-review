<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 178" role="img"
     aria-label="A deployment checklist: use case, feature set, then launch and run">
  <style>
    svg { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bg{fill:var(--soft,#e8faf1)} .acc{fill:var(--acc,#1aad55)}
    .sacc{fill:none;stroke:var(--acc,#1aad55)} .ink{fill:#14211f}
    text{font-weight:760} .t{fill:#14211f} .ta{fill:var(--acc,#1aad55);font-weight:820}
    .tick{opacity:0}
    @keyframes dep-d1{0%,16%{opacity:0}26%,100%{opacity:1}}
    @keyframes dep-d2{0%,38%{opacity:0}48%,100%{opacity:1}}
    @keyframes dep-d3{0%,60%{opacity:0}70%,100%{opacity:1}}
    .t1{animation:dep-d1 4.2s ease-in-out infinite}
    .t2{animation:dep-d2 4.2s ease-in-out infinite}
    .t3{animation:dep-d3 4.2s ease-in-out infinite}
    @media (prefers-reduced-motion: reduce){.tick{animation:none;opacity:1}}
  </style>

  <rect class="bg" width="280" height="178"/>
  <ellipse class="ink" cx="140" cy="158" rx="78" ry="6" opacity="0.05"/>
  <rect class="sacc" style="fill:var(--soft,#e8faf1)" x="80" y="30" width="120" height="124" rx="10" stroke-width="2.5"/>
  <rect class="sacc" style="fill:var(--soft,#e8faf1)" x="116" y="23" width="48" height="15" rx="5" stroke-width="2.5"/>
  <text class="ta" x="92" y="58" font-size="11" textLength="96" lengthAdjust="spacingAndGlyphs">Launch checklist</text>

  <rect class="sacc" x="92" y="72"  width="14" height="14" rx="3" stroke-width="2"/>
  <rect class="sacc" x="92" y="100" width="14" height="14" rx="3" stroke-width="2"/>
  <rect class="sacc" x="92" y="128" width="14" height="14" rx="3" stroke-width="2"/>
  <text class="t" x="114" y="83"  font-size="9" textLength="42" lengthAdjust="spacingAndGlyphs">Use case</text>
  <text class="t" x="114" y="111" font-size="9" textLength="54" lengthAdjust="spacingAndGlyphs">Feature set</text>
  <text class="t" x="114" y="139" font-size="9" textLength="58" lengthAdjust="spacingAndGlyphs">Launch + run</text>

  <g class="tick t1"><rect class="acc" x="92" y="72"  width="14" height="14" rx="3"/><path d="M95 79  l3 3 5 -6" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g class="tick t2"><rect class="acc" x="92" y="100" width="14" height="14" rx="3"/><path d="M95 107 l3 3 5 -6" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g class="tick t3"><rect class="acc" x="92" y="128" width="14" height="14" rx="3"/><path d="M95 135 l3 3 5 -6" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
</svg>
