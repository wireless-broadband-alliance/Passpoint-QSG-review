<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 178" role="img"
     aria-label="A user asks whether to tap the network; with a matching profile the device joins by itself">
  <style>
    svg { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bg{fill:var(--soft,#e8f4fb)} .acc{fill:var(--acc,#085d8e)}
    .sacc{fill:none;stroke:var(--acc,#085d8e)} .soft{fill:var(--soft,#e8f4fb)}
    .ok{fill:#1aad55} .ink{fill:#14211f}
    text{font-weight:760} .tm{fill:#60706d;font-weight:700}
    .ans{opacity:0}
    @keyframes faq-a{0%,28%{opacity:0}40%,90%{opacity:1}100%{opacity:0}}
    .ans{animation:faq-a 4.2s ease-in-out infinite}
    @media (prefers-reduced-motion: reduce){.ans{animation:none;opacity:1}}
  </style>

  <rect class="bg" width="280" height="178"/>
  <ellipse class="ink" cx="68" cy="164" rx="40" ry="5" opacity="0.06"/>

  <!-- phone with the Wi-Fi list the user is staring at -->
  <rect class="sacc" x="30" y="22" width="76" height="132" rx="12" stroke-width="2.5"/>
  <text class="tm" x="40" y="44" font-size="8" textLength="38" lengthAdjust="spacingAndGlyphs">Wi-Fi list</text>
  <rect class="sacc" x="40" y="54" width="56" height="24" rx="5" stroke-width="2"/>
  <text class="ink" x="46" y="69" font-size="8" textLength="44" lengthAdjust="spacingAndGlyphs">MyOperator</text>
  <rect class="acc" x="40" y="88"  width="56" height="18" rx="5" opacity="0.1"/>
  <rect class="acc" x="40" y="114" width="56" height="18" rx="5" opacity="0.1"/>

  <!-- the question every support team hears -->
  <path class="acc" d="M124 56 l-9 5 9 5 z"/>
  <rect class="acc" x="122" y="40" width="134" height="42" rx="8"/>
  <text x="189" y="58" font-size="9" fill="#fff" text-anchor="middle" textLength="76" lengthAdjust="spacingAndGlyphs">"Do I tap it and</text>
  <text x="189" y="72" font-size="9" fill="#fff" text-anchor="middle" textLength="46" lengthAdjust="spacingAndGlyphs">sign in?"</text>

  <!-- the answer -->
  <g class="ans">
    <g transform="translate(136,116)">
      <circle class="ok" cx="0" cy="0" r="12"/>
      <path d="M-5 0 l3.5 3.5 7 -8" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text class="ink" x="154" y="113" font-size="9" textLength="82" lengthAdjust="spacingAndGlyphs">No - it joins by itself</text>
    <text class="ink" x="154" y="126" font-size="9" textLength="88" lengthAdjust="spacingAndGlyphs">once a profile matches</text>
  </g>
</svg>
