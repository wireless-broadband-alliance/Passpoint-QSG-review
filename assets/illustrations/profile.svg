<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 178" role="img"
     aria-label="A Passpoint profile from a carrier, MDM or app installs on the device">
  <style>
    svg { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bg{fill:var(--soft,#e8f4fb)} .acc{fill:var(--acc,#0b74b1)}
    .sacc{fill:none;stroke:var(--acc,#0b74b1)} .soft{fill:var(--soft,#e8f4fb)}
    .ok{fill:#1aad55} .ink{fill:#14211f}
    text{font-weight:760} .t{fill:#14211f} .tm{fill:#60706d;font-weight:700}
    .feed{stroke-dasharray:3 4}
    .lit{opacity:0}
    @keyframes prof-flow{to{stroke-dashoffset:-14}}
    @keyframes prof-seal{0%,50%{opacity:0}62%,94%{opacity:1}100%{opacity:0}}
    .feed{animation:prof-flow 1.1s linear infinite}
    .seal{animation:prof-seal 4.2s ease-in-out infinite}
    @media (prefers-reduced-motion: reduce){
      .feed,.seal{animation:none}
      .lit{opacity:1}
    }
  </style>

  <rect class="bg" width="280" height="178"/>
  <ellipse class="ink" cx="221" cy="150" rx="34" ry="5" opacity="0.06"/>

  <!-- where profiles come from -->
  <rect class="sacc" x="18" y="36"  width="64" height="20" rx="5" stroke-width="1.6"/>
  <rect class="sacc" x="18" y="70"  width="64" height="20" rx="5" stroke-width="1.6"/>
  <rect class="sacc" x="18" y="104" width="64" height="20" rx="5" stroke-width="1.6"/>
  <text class="tm" x="50" y="50"  font-size="9" text-anchor="middle" textLength="38" lengthAdjust="spacingAndGlyphs">Carrier</text>
  <text class="tm" x="50" y="84"  font-size="9" text-anchor="middle" textLength="28" lengthAdjust="spacingAndGlyphs">MDM</text>
  <text class="tm" x="50" y="118" font-size="9" text-anchor="middle" textLength="24" lengthAdjust="spacingAndGlyphs">App</text>

  <!-- delivery paths converge on the profile -->
  <path class="sacc feed" d="M82 46 C102 46 104 74 118 80" stroke-width="1.6" opacity="0.75"/>
  <path class="sacc feed" d="M82 80 C98 80 104 83 118 84" stroke-width="1.6" opacity="0.75"/>
  <path class="sacc feed" d="M82 114 C102 114 104 94 118 88" stroke-width="1.6" opacity="0.75"/>

  <!-- the profile: matching rules + credential -->
  <g transform="translate(118,62)">
    <rect class="sacc" style="fill:var(--soft,#e8f4fb)" x="0" y="0" width="44" height="44" rx="6" stroke-width="2.5"/>
    <circle class="acc" cx="22" cy="14" r="5.5" opacity="0.45"/>
    <rect class="acc" x="8"  y="26" width="28" height="3.4" rx="1.7" opacity="0.25"/>
    <rect class="acc" x="8"  y="33" width="20" height="3.4" rx="1.7" opacity="0.25"/>
  </g>

  <!-- into the phone -->
  <path class="sacc" d="M166 84 h16" stroke-width="2.5" stroke-linecap="round"/>
  <path class="sacc" d="M177 78 l7 6 -7 6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- device -->
  <rect class="sacc" x="192" y="34" width="58" height="104" rx="12" stroke-width="2.5"/>
  <rect class="soft" x="199" y="46" width="44" height="80" rx="4"/>
  <g class="lit seal" transform="translate(221,86)">
    <circle class="ok" cx="0" cy="0" r="13"/>
    <path d="M-5.5 0 l4 4 8 -9" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text class="tm" x="221" y="162" font-size="10" text-anchor="middle" textLength="80" lengthAdjust="spacingAndGlyphs">Profile installed</text>
</svg>
