<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 178" role="img"
     aria-label="Passpoint is enterprise Wi-Fi: WPA-Enterprise, 802.1X EAP, dynamic keys and protected management frames">
  <style>
    svg { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bg{fill:var(--soft,#fff5f5)} .acc{fill:var(--acc,#e53e3e)}
    .sacc{fill:none;stroke:var(--acc,#e53e3e)} .ink{fill:#14211f}
    text{font-weight:760} .t{fill:#14211f} .tm{fill:#60706d;font-weight:700}
    .fill{fill:var(--acc,#e53e3e);opacity:0}
    .hl{fill:none;stroke:var(--acc,#e53e3e);stroke-width:2.5;opacity:0}
    @keyframes sec-fill{0%,70%{opacity:0}84%,100%{opacity:.1}}
    @keyframes sec-r1{0%,10%{opacity:0}18%,100%{opacity:1}}
    @keyframes sec-r2{0%,26%{opacity:0}34%,100%{opacity:1}}
    @keyframes sec-r3{0%,42%{opacity:0}50%,100%{opacity:1}}
    @keyframes sec-r4{0%,58%{opacity:0}66%,100%{opacity:1}}
    .sf{animation:sec-fill 4s ease-in-out infinite}
    .l1{animation:sec-r1 4s ease-in-out infinite}
    .l2{animation:sec-r2 4s ease-in-out infinite}
    .l3{animation:sec-r3 4s ease-in-out infinite}
    .l4{animation:sec-r4 4s ease-in-out infinite}
    @media (prefers-reduced-motion: reduce){
      .sf,.l1,.l2,.l3,.l4{animation:none}
      .hl{opacity:1}.fill{opacity:.1}
    }
  </style>

  <rect class="bg" width="280" height="178"/>
  <ellipse class="ink" cx="95" cy="146" rx="40" ry="5" opacity="0.05"/>

  <!-- shield + padlock -->
  <path class="sacc" d="M95 36 L128 49 V90 C128 114 113 129 95 138 C77 129 62 114 62 90 V49 Z" stroke-width="2.5"/>
  <path class="fill sf" d="M95 36 L128 49 V90 C128 114 113 129 95 138 C77 129 62 114 62 90 V49 Z"/>
  <rect class="acc" x="85" y="88" width="20" height="16" rx="3"/>
  <path class="sacc" d="M89 88 v-5 a6 6 0 0 1 12 0 v5" stroke-width="3"/>
  <circle fill="#fff" cx="95" cy="95" r="2.4"/>
  <text class="tm" x="95" y="162" font-size="9" text-anchor="middle" textLength="76" lengthAdjust="spacingAndGlyphs">Enterprise Wi-Fi</text>

  <!-- security layers -->
  <rect class="sacc" x="150" y="38"  width="106" height="22" rx="6" stroke-width="2"/>
  <rect class="sacc" x="150" y="68"  width="106" height="22" rx="6" stroke-width="2"/>
  <rect class="sacc" x="150" y="98"  width="106" height="22" rx="6" stroke-width="2"/>
  <rect class="sacc" x="150" y="128" width="106" height="22" rx="6" stroke-width="2"/>
  <text class="t" x="162" y="53"  font-size="11" textLength="86" lengthAdjust="spacingAndGlyphs">WPA-Enterprise</text>
  <text class="t" x="162" y="83"  font-size="11" textLength="72" lengthAdjust="spacingAndGlyphs">802.1X / EAP</text>
  <text class="t" x="162" y="113" font-size="11" textLength="74" lengthAdjust="spacingAndGlyphs">Dynamic keys</text>
  <text class="t" x="162" y="143" font-size="11" textLength="26" lengthAdjust="spacingAndGlyphs">PMF</text>
  <rect class="hl l1" x="150" y="38"  width="106" height="22" rx="6"/>
  <rect class="hl l2" x="150" y="68"  width="106" height="22" rx="6"/>
  <rect class="hl l3" x="150" y="98"  width="106" height="22" rx="6"/>
  <rect class="hl l4" x="150" y="128" width="106" height="22" rx="6"/>
</svg>
