<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 178" role="img"
     aria-label="ANQP matches the device against domain, NAI realm, RCOI and PLMN">
  <style>
    svg { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bg{fill:var(--soft,#e8faf1)} .acc{fill:var(--acc,#1aad55)}
    .sacc{fill:none;stroke:var(--acc,#1aad55)} .ink{fill:#14211f}
    text{font-weight:760} .t{fill:#14211f} .ta{fill:var(--acc,#1aad55);font-weight:820}
    .ring{fill:none;stroke:var(--acc,#1aad55);stroke-width:1.6;opacity:.25}
    .chk{opacity:0}
    @keyframes id-c1{0%{opacity:0}6%,92%{opacity:1}100%{opacity:0}}
    @keyframes id-c2{0%,6%{opacity:0}12%,92%{opacity:1}100%{opacity:0}}
    @keyframes id-c3{0%,12%{opacity:0}18%,92%{opacity:1}100%{opacity:0}}
    @keyframes id-c4{0%,18%{opacity:0}24%,92%{opacity:1}100%{opacity:0}}
    .k1{animation:id-c1 5s ease-in-out infinite}
    .k2{animation:id-c2 5s ease-in-out infinite}
    .k3{animation:id-c3 5s ease-in-out infinite}
    .k4{animation:id-c4 5s ease-in-out infinite}
    @media (prefers-reduced-motion: reduce){.chk{animation:none;opacity:1}}
  </style>

  <rect class="bg" width="280" height="178"/>
  <ellipse class="ink" cx="140" cy="160" rx="86" ry="6" opacity="0.05"/>
  <rect fill="#fff" class="sacc" x="64" y="24" width="152" height="128" rx="10" stroke-width="2.5"/>
  <path class="sacc" d="M64 50 h152" stroke-width="2"/>
  <text class="ta" x="80" y="42" font-size="12" textLength="92" lengthAdjust="spacingAndGlyphs">ANQP match</text>
  <circle class="acc" cx="198" cy="37" r="6" opacity="0.18"/>

  <text class="t" x="82" y="69"  font-size="12" textLength="60" lengthAdjust="spacingAndGlyphs">Domain</text>
  <text class="t" x="82" y="93"  font-size="12" textLength="84" lengthAdjust="spacingAndGlyphs">NAI realm</text>
  <text class="t" x="82" y="117" font-size="12" textLength="42" lengthAdjust="spacingAndGlyphs">RCOI</text>
  <text class="t" x="82" y="141" font-size="12" textLength="48" lengthAdjust="spacingAndGlyphs">PLMN</text>

  <circle class="ring" cx="194" cy="65"  r="8"/>
  <circle class="ring" cx="194" cy="89"  r="8"/>
  <circle class="ring" cx="194" cy="113" r="8"/>
  <circle class="ring" cx="194" cy="137" r="8"/>

  <g class="chk k1"><circle class="acc" cx="194" cy="65"  r="8"/><path d="M190 65 l3 3 5 -6"  fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g class="chk k2"><circle class="acc" cx="194" cy="89"  r="8"/><path d="M190 89 l3 3 5 -6"  fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g class="chk k3"><circle class="acc" cx="194" cy="113" r="8"/><path d="M190 113 l3 3 5 -6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g class="chk k4"><circle class="acc" cx="194" cy="137" r="8"/><path d="M190 137 l3 3 5 -6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
</svg>
